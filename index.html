<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 20px;
        }
        #reader {
            width: 350px;
            margin: auto;
        }
        #status {
            margin: 10px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h2>Scan Fuel Slip QR</h2>
    <div id="status">Starting camera...</div>
    <div id="reader"></div>

    <script>
        let scannerStarted = false;

        /* Send result back to main app */
        function sendResult(decodedText) {
            if (window.opener) {
                window.opener.postMessage({ type: "qr_result", value: decodedText }, "*");
            }
            // Small delay before close (important stability fix)
            setTimeout(() => {
                window.close();
            }, 300);
        }

        /* Scan success */
        function onScanSuccess(decodedText) {
            if (scannerStarted === false) return;
            document.getElementById("status").innerText = "Scanned: " + decodedText;
            sendResult(decodedText);
        }

        /* Start camera */
        const html5Qrcode = new Html5Qrcode("reader");
        
        html5Qrcode.getCameras()
            .then(cameras => {
                if (!cameras || cameras.length === 0) {
                    document.getElementById("status").innerText = "No camera found";
                    return;
                }
                
                document.getElementById("status").innerText = "Camera ready...";
                let cameraId = cameras[0].id;
                
                // Force back camera
                for (let i = 0; i < cameras.length; i++) {
                    const label = (cameras[i].label || "").toLowerCase();
                    if (label.includes("back") || label.includes("rear") || label.includes("environment")) {
                        cameraId = cameras[i].id;
                        break;
                    }
                }
                
                html5Qrcode.start(
                    cameraId, 
                    { fps: 10, qrbox: 250 }, 
                    onScanSuccess
                ).then(() => {
                    scannerStarted = true;
                });
            })
            .catch(err => {
                document.getElementById("status").innerText = "Camera error: " + err;
                console.error(err);
            });
    </script>
</body>
</html>
